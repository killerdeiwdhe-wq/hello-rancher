replicaCount: 1

image:
  repository: jun2281/hello-rancher
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

ingress:
  enable: true
  ingressClassName: nginx
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix
  tls: []
